# AWS Marketplace distribution overlay.
#
# CI merges these values into a staged copy's values.yaml before packaging.
# Every rendered image must resolve to an AWS Marketplace-managed ECR
# repository so AWS can replicate the product across regions.
controller:
  image:
    chroot: false
    registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com
    image: herodevs/ingress-nginx-nes
    # No tag here: scripts/stage_marketplace_chart.sh sets it to the chart's
    # appVersion, the release tag that ingress-nginx-nes release.yml pushes to
    # Marketplace ECR. A hard-coded pin (v1.15.1-nes-1.15.7-2, the scanner-clean
    # 1.15.7 respin) went stale and shipped the 1.15.7 controller in Marketplace
    # charts 0.0.14 (1.15.8) and 0.0.15 (1.15.9).
    digest: ""
    digestChroot: ""
  admissionWebhooks:
    patch:
      image:
        registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com
        image: herodevs/ingress-nginx-nes-kube-webhook-certgen
        digest: ""

defaultBackend:
  image:
    registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com
    image: herodevs/ingress-nginx-nes-defaultbackend
