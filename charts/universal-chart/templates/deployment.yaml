apiVersion: apps/v1
kind: Deployment
{{- $deploymentAnnotations := deepCopy (.Values.deployment.annotations | default dict) }}
{{- $reloadAnnotation := "reloader.stakater.com/auto" }}
{{- if and .Values.reloader.enabled (not (hasKey $deploymentAnnotations $reloadAnnotation)) }}
{{- $_ := set $deploymentAnnotations $reloadAnnotation "true" }}
{{- end }}
{{- /* Detect whether the legacy initContainers block will render. */}}
{{- $hasLegacyInit := false }}
{{- with .Values.initContainers }}
{{- if get (first .) "image" }}
{{- $hasLegacyInit = true }}
{{- end }}
{{- end }}
{{- /* Container names must be unique within the pod. Collect every name the
chart generates, then fail fast on a collision instead of letting the API
server reject the Deployment with a less helpful error. */}}
{{- $containerNames := list .Chart.Name }}
{{- if $hasLegacyInit }}
{{- range $i, $_ := .Values.initContainers }}
{{- $containerNames = append $containerNames (printf "init-%s-%d" $.Chart.Name $i) }}
{{- end }}
{{- end }}
{{- $nativeSidecars := list }}
{{- $regularSidecars := list }}
{{- range .Values.extraContainers }}
{{- if has .name $containerNames }}
{{- fail (printf "extraContainers entry %q duplicates another container name in this pod (the main container is named %q and init containers are named init-%s-<index>); container names must be unique" .name $.Chart.Name $.Chart.Name) }}
{{- end }}
{{- $containerNames = append $containerNames .name }}
{{- if .nativeSidecar }}
{{- $nativeSidecars = append $nativeSidecars . }}
{{- else }}
{{- $regularSidecars = append $regularSidecars . }}
{{- end }}
{{- end }}
metadata:
  name: {{ include "universal-chart.fullname" . }}
  labels:
    {{- include "universal-chart.labels" . | nindent 4 }}
  {{- with $deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "universal-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "universal-chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "universal-chart.serviceAccountName" . }}
      {{- if ne .Values.terminationGracePeriodSeconds nil }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          env:
            {{- include "universal-chart.containerEnv" . | nindent 12 }}
          {{- with include "universal-chart.containerEnvFrom" . | trim }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "universal-chart.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- range .Values.extraContainerPorts }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraContainerProps }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- range $regularSidecars }}
        {{- include "universal-chart.extraContainer" (dict "root" $ "container" .) | nindent 8 }}
        {{- end }}

      {{- if or $nativeSidecars $hasLegacyInit }}
      initContainers:
        {{- /* Native sidecars render first so their startup probes gate the
        legacy init containers; a migration that needs a proxy can rely on the
        proxy being up before it runs. */}}
        {{- range $nativeSidecars }}
        {{- include "universal-chart.extraContainer" (dict "root" $ "container" . "native" true) | nindent 8 }}
        {{- end }}
        {{- if $hasLegacyInit }}
        {{- range $i, $init := .Values.initContainers }}
        - name: init-{{ $.Chart.Name }}-{{ $i }}
          image: {{ $init.image }}
          {{- with $init.command }}
          command:
            {{- range . }}
            - {{ . }}
            {{- end }}
          {{- end }}
          {{- with $.Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "universal-chart.containerEnv" $ | nindent 12 }}
          {{- with include "universal-chart.containerEnvFrom" $ | trim }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $init.extraContainerProps }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}

      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $selectorLabels := include "universal-chart.selectorLabels" . | fromYaml }}
      {{- $defaultLabelSelector := dict "matchLabels" $selectorLabels }}
      {{- $topologySpreadConstraints := list }}
      {{- $topologyKeys := list }}
      {{- $availabilityTopologyKeys := list "topology.kubernetes.io/zone" "kubernetes.io/hostname" }}
      {{- if .Values.availability.enabled }}
      {{- $whenUnsatisfiable := ternary "DoNotSchedule" "ScheduleAnyway" (eq .Values.availability.mode "strict") }}
      {{- range $availabilityTopologyKeys }}
      {{- $topologySpreadConstraints = append $topologySpreadConstraints (dict "maxSkew" 1 "topologyKey" . "whenUnsatisfiable" $whenUnsatisfiable "labelSelector" $defaultLabelSelector) }}
      {{- $topologyKeys = append $topologyKeys . }}
      {{- end }}
      {{- end }}
      {{- range .Values.topologySpreadConstraints }}
      {{- $constraint := . }}
      {{- if not (hasKey $constraint "labelSelector") }}
      {{- $constraint = merge $constraint (dict "labelSelector" $defaultLabelSelector) }}
      {{- end }}
      {{- if not (and $.Values.availability.enabled (has $constraint.topologyKey $availabilityTopologyKeys)) }}
      {{- $topologySpreadConstraints = append $topologySpreadConstraints $constraint }}
      {{- $topologyKeys = append $topologyKeys $constraint.topologyKey }}
      {{- end }}
      {{- end }}
      {{- if and .Values.spread_azs (not (has "topology.kubernetes.io/zone" $topologyKeys)) }}
      {{- $topologySpreadConstraints = append $topologySpreadConstraints (dict "maxSkew" 1 "topologyKey" "topology.kubernetes.io/zone" "whenUnsatisfiable" "ScheduleAnyway" "labelSelector" $defaultLabelSelector) }}
      {{- $topologyKeys = append $topologyKeys "topology.kubernetes.io/zone" }}
      {{- end }}
      {{- if and .Values.spread_spot (not (has "karpenter.sh/capacity-type" $topologyKeys)) }}
      {{- $topologySpreadConstraints = append $topologySpreadConstraints (dict "maxSkew" 1 "topologyKey" "karpenter.sh/capacity-type" "whenUnsatisfiable" "ScheduleAnyway" "labelSelector" $defaultLabelSelector) }}
      {{- end }}
      {{- with $topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
