{{- $autosizing := .Values.autosizing | default dict -}}
{{- include "universal-chart.autosizing.validate" (dict "root" . "config" $autosizing) -}}
{{- if $autosizing.enabled -}}
{{- $updatePolicy := $autosizing.updatePolicy | default dict -}}
{{- $updateMode := $updatePolicy.updateMode | default "Off" -}}
{{- $policies := $autosizing.resourcePolicy.containerPolicies | default list -}}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "universal-chart.fullname" . | quote }}
  labels:
    {{- include "universal-chart.labels" . | nindent 4 }}
  {{- with $autosizing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "universal-chart.fullname" . }}
  updatePolicy:
    updateMode: {{ $updateMode | quote }}
    minReplicas: {{ $updatePolicy.minReplicas }}
  resourcePolicy:
    containerPolicies:
      {{- toYaml $policies | nindent 6 }}
{{- end }}
