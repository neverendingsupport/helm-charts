image:
  repository: ghcr.io/example/app
  tag: "1.2.3"

autoscaling:
  vertical:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-wave: "10"
    updatePolicy:
      updateMode: "Off"
      minReplicas: 2
    resourcePolicy:
      containerPolicies:
        - containerName: "*"
          mode: Auto
          controlledResources:
            - cpu
            - memory
          controlledValues: RequestsOnly
          minAllowed:
            cpu: 50m
            memory: 64Mi
          maxAllowed: {}
